    <script>
        // 动态更新SEO相关元标签
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const title = urlParams.get('title');
            
            if (title) {
                const decodedTitle = decodeURIComponent(title);
                
                // 更新页面标题
                document.title = decodedTitle + ' - 寻感博客';
                
                // 更新meta description
                const metaDesc = document.getElementById('meta-description');
                metaDesc.content = '寻感博客 - ' + decodedTitle + '，提供详细解决方案和技术指导';
                
                // 更新meta keywords
                const metaKeywords = document.getElementById('meta-keywords');
                const keywordsFromTitle = decodedTitle.replace(/[\[\]]/g, '').split(/[,，\s]/);
                const filteredKeywords = keywordsFromTitle.filter(k => k.length > 1);
                metaKeywords.content = filteredKeywords.join(',') + ',教程,解决方案,博客,技术分享';
                
                // 更新规范链接
                const canonicalLink = document.getElementById('canonical-link');
                canonicalLink.href = 'https://buttonwood.cn/createIdea.html?title=' + encodeURIComponent(title);
                
                // 更新Open Graph标签
                document.getElementById('og-url').content = 'https://buttonwood.cn/createIdea.html?title=' + encodeURIComponent(title);
                document.getElementById('og-title').content = decodedTitle + ' - 寻感博客';
                document.getElementById('og-description').content = '寻感博客 - ' + decodedTitle + '，提供详细解决方案和技术指导';
                
                // 更新Twitter标签
                document.getElementById('twitter-url').content = 'https://buttonwood.cn/createIdea.html?title=' + encodeURIComponent(title);
                document.getElementById('twitter-title').content = decodedTitle + ' - 寻感博客';
                document.getElementById('twitter-description').content = '寻感博客 - ' + decodedTitle + '，提供详细解决方案和技术指导';
            }
        });
    </script>

<body class="neo">
    <div class="neo-container">
        <div class="neo-sidebar" id="neo-sidebar"></div>
        <div class="neo-overlay" id="neo-overlay"></div>
        <div class="neo-menu-btn" id="neo-menu-btn"><span></span><span></span><span></span></div>
        <div class="neo-main" id="blogMain">
            <div id="blogHeader" class="neo-page-header">
                <div class="section-label neo-reveal">◇ Blog</div>
                <h1 class="neo-reveal neo-reveal-d1">个人博客</h1>
                <p class="neo-reveal neo-reveal-d2">寻感论剑证道 · 技术与思考</p>
                <div class="neo-section-line neo-reveal neo-reveal-d2"></div>
            </div>
            <div class="cardList neo-card-grid" id="blogCards" style="padding-top:0;"></div>
            <textarea id="$t" style="display:none;">*Blog* not **Found** here.</textarea>
            <div id="$m" class="markdown-body neo-article" style="text-align:left;margin:2%;display:none;"></div>


            <!--                <textarea id="$t" style="display:none">-->



            <div class="neo-footer"><p>© 2026 Buttonwood · 寻感论剑证道</p></div>
        </div>
    </div>
    <link rel="stylesheet" href="css/neo.css">
    <script src="js/neo.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/router.js"></script>
    <script>
    hljs.highlightAll();
    fetch('neo-leftbox.html').then(r=>r.text()).then(d=>{
        document.getElementById('neo-sidebar').innerHTML = d;
        document.querySelectorAll('.neo-nav li[data-page]').forEach(li=>{
            if(li.dataset.page==='createIdea') li.classList.add('active');
        });
    });
    // Transform blog cards to neo style
    setTimeout(()=>{
        document.querySelectorAll('#blogCards .card-default').forEach((a,i)=>{
            a.classList.add('neo-card','neo-reveal','neo-reveal-d'+(i%4+1));
            const icon=a.querySelector('.card-icon');
            const name=a.querySelector('.card-name');
            const desc=a.querySelector('.card-des');
            if(icon){icon.classList.add('neo-card-icon');icon.classList.remove('card-icon','bg-img','round');}
            if(name){const h3=document.createElement('h3');h3.textContent=name.textContent.trim();name.replaceWith(h3);}
            if(desc){const p=document.createElement('p');p.textContent=desc.textContent.trim();desc.parentElement.replaceWith(p);}
            const main=a.querySelector('.card-main');
            if(main){main.classList.add('neo-card-info');main.classList.remove('card-main');}
            const card=a.querySelector('.card');
            if(card){while(card.firstChild){a.insertBefore(card.firstChild,card);}card.remove();}
        });
        setTimeout(()=>document.querySelectorAll('#blogCards .neo-card').forEach(el=>el.classList.add('visible')),300);
    },400);
    // When viewing an article, style the markdown area and add back button
    setTimeout(()=>{
        const md=document.getElementById('$m');
        if(md && md.style.display!=='none' && md.innerHTML.trim()){
            md.style.display='block';
            document.getElementById('blogHeader').style.display='none';
            document.getElementById('blogCards').style.display='none';
            // Add back link
            const back=document.createElement('a');
            back.href='createIdea.html';back.className='neo-back-btn';
            back.innerHTML='← 返回博客列表';
            back.style.cssText='display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color .3s;position:relative;z-index:2;';
            back.onmouseenter=()=>back.style.color='var(--cyan)';
            back.onmouseleave=()=>back.style.color='var(--text-dim)';
            md.insertBefore(back,md.firstChild);
        }
    },600);
    </script>
