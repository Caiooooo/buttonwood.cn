<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻感 - 寻找无穷创作灵感</title>
    <link rel="shortcut icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/font.css">

    <script src="js/echarts.js"></script>
    <script src="js/china.js"></script>
    <script src="js/mapData.js"></script>
    <script src="js/reg.js"></script>
    <meta name="google-adsense-account" content="ca-pub-9340624494211701">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9340624494211701"
        crossorigin="anonymous"></script>
</head>

<body class="neo">
    <div class="neo-container">
        <div class="neo-sidebar" id="neo-sidebar"></div>
        <div class="neo-overlay" id="neo-overlay"></div>
        <div class="neo-menu-btn" id="neo-menu-btn"><span></span><span></span><span></span></div>
        <div class="neo-main">
            <div class="neo-map-wrap" style="padding:0;">
                <div id="china-map" style="width:100%;height:100vh;"></div>
                <script src="js/china-map.js"></script>
                <script>
                    function getQueryParam(name) {
                        const url = window.location.search;
                        const params = new URLSearchParams(url);
                        return params.get(name);
                    }
                    function loadUserMapData(callback) {
                        const userName = getQueryParam('userName');
                        if (userName) {
                            fetch('js/mapData/' + userName + '.json')
                                .then(res => res.ok ? res.json() : Promise.reject())
                                .then(json => callback(json))
                                .catch(() => callback(window.data));
                        } else {
                            callback(window.data);
                        }
                    }
                </script>
                <script>
                    function renderChinaMap(mapData) {
                        var chinaMap = echarts.init(document.getElementById("china-map"));
                        window.onresize = chinaMap.resize;
                        const leftBox = document.getElementById("left-box") || document.getElementById("neo-sidebar");
                        if (leftBox) {
                            const resizeObserver = new ResizeObserver(() => { chinaMap.resize(); });
                            resizeObserver.observe(leftBox);
                        }
                        window.addEventListener("resize", function () { chinaMap.resize(); });
                        chinaMap.setOption({
                            tooltip: {
                                formatter: function (params) {
                                    let value = params.value.toString();
                                    if (!isNaN(value)) {
                                        let year = value.substring(0, 4);
                                        let month = value.substring(4, 6);
                                        let day = value.substring(6, 8);
                                        value = `${year}-${month}-${day}`;
                                    }
                                    return params.name + ": " + value;
                                }
                            },
                            dataRange: {
                                show: false,
                                min: 0,
                                max: 9999999999,
                                text: ["High", "Low"],
                                realtime: true,
                                calculable: true,
                                color: ["orangered", "#FF9B52", "#FFD068"],
                            },
                            geo: {
                                map: "china",
                                roam: true,
                                label: { normal: { show: true, textStyle: { color: "#fff" } } },
                                itemStyle: {
                                    normal: { borderColor: "#293171", borderWidth: "2", areaColor: "#0A0F33" },
                                    emphasis: { areaColor: null, shadowOffsetX: 0, shadowOffsetY: 0, shadowBlur: 20, borderWidth: 0, shadowColor: "rgba(0, 0, 0, 0.5)" }
                                }
                            },
                            series: [
                                { type: "scatter", coordinateSystem: "geo" },
                                { name: "点亮日期", type: "map", geoIndex: 0, data: mapData }
                            ]
                        });
                    }
                    loadUserMapData(function (mapData) {
                        renderChinaMap(mapData);
                    });
                </script>

            </div>
            <div class="neo-footer"><p>© 2026 Buttonwood · 足迹遍布世界</p></div>
        </div>
    </div>
    <link rel="stylesheet" href="css/neo.css">
    <script src="js/neo.js"></script>
    <script>
    fetch('neo-leftbox.html').then(r=>r.text()).then(d=>{
        document.getElementById('neo-sidebar').innerHTML = d;
        document.querySelectorAll('.neo-nav li[data-page]').forEach(li=>{
            if(li.dataset.page==='photoIdea') li.classList.add('active');
        });
    });
    </script>
</body>

</html>
