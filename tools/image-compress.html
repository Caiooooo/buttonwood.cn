    <style>

        .compression-info .highlight {
            color: rgb(120, 189, 253);
            font-weight: 600;

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        .checkbox-group label {
            margin: 0;

        }

<body onload="loaduser()" id="home">
    <div class="container">
        <div class="left-box" id="left-box"></div>
        <script>
            function isMobileDevice() {
                return window.innerWidth / window.innerHeight < 1.2;
            }
            function setLeftBoxWidth() {
                const leftBox = document.getElementById('left-box');
                const handler = document.querySelector('.handler');
                const containerWidth = document.querySelector('.container').offsetWidth;
                const menuButton = document.getElementById('menu-button');
                if (isMobileDevice()) {
                    leftBox.style.width = '0';
                    if (handler) handler.style.left = "5px";
                    if (handler) handler.classList.add('close');
                    if (menuButton) menuButton.style.display = 'block';
                } else {
                    const sidebarWidth = Math.max(containerWidth * 0.02, 210);
                    leftBox.style.width = sidebarWidth + 'px';
                    if (handler) handler.style.left = (sidebarWidth + 5) + "px";
                    if (handler) handler.classList.remove('close');
                    if (menuButton) menuButton.style.display = 'none';
                }
            }
            fetch('../leftbox.html')
                .then(response => response.text())
                .then(data => {
                    data = data.replace(/src="img\//g, 'src="../img/');
                    document.getElementById('left-box').innerHTML = data;
                    const userImage = document.querySelector(".user-info img");
                    if (userImage && !userImage.src.includes('../img/')) {
                        userImage.src = "../img/bw.jpg";
                    }
                    setTimeout(() => {
                        const iconMap = {
                            'icon-home': '../img/icon/home.png',
                            'icon-design': '../img/icon/灯泡.png',
                            'icon-art': '../img/icon/笔.png',
                            'icon-photo': '../img/icon/相机.png',
                            'icon-create': '../img/icon/册子.png',
                            'icon-tools': '../img/icon/几何.png',
                            'aboutUs': '../img/icon/爱情.png'
                        };
                        Object.keys(iconMap).forEach(className => {
                            const icons = document.querySelectorAll(`.left-box .${className}`);
                            icons.forEach(icon => {
                                icon.style.backgroundImage = `url("${iconMap[className]}")`;
                            });
                        });
                    }, 100);
                    setLeftBoxWidth();
                    window.addEventListener('resize', setLeftBoxWidth);
                    const menuButton = document.getElementById('menu-button');
                    const leftBox = document.getElementById('left-box');
                    const handler = document.querySelector('.handler');
                    if (menuButton) {
                        menuButton.addEventListener('click', function () {
                            this.classList.toggle('active');
                            if (leftBox.style.width === '0px') {
                                leftBox.style.width = '210px';
                                if (handler) handler.style.left = "215px";
                                if (handler) handler.classList.remove('close');
                            } else {
                                leftBox.style.width = '0';
                                if (handler) handler.style.left = "5px";
                                if (handler) handler.classList.add('close');
                            }
                        });
                    }
                })
                .catch(error => console.error('Error loading left-box.html:', error));
        </script>

        <div class="right-box" style="background: none;">
            <div class="right-top">
                <div class="menu-button" id="menu-button">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <i class="icon-art"></i>
                <span>图片压缩</span>
                <span class="right-top-span-2">在线图片压缩优化工具</span>
            </div>

            <div class="tool-container">
                <a href="../tools.html" class="back-link">← 返回工具列表</a>

                <div class="tool-title">图片压缩工具</div>

                <div class="tool-section">
                    <div class="file-input">
                        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                    </div>
                </div>

                <div class="tool-section" id="optionsSection" style="display: none;">
                    <h3>压缩选项</h3>

                    <div class="input-group">
                        <label>
                            压缩质量: <span class="range-value" id="qualityValue">0.8</span>
                        </label>
                        <input type="range" id="qualityRange" min="0.1" max="1" step="0.1" value="0.8"
                            oninput="updateQualityValue(this.value)">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="resizeCheckbox" onchange="toggleResizeOptions()">
                        <label for="resizeCheckbox">调整图片尺寸</label>
                    </div>

                    <div id="resizeOptions" style="display: none; margin-top: 15px;">
                        <div class="input-group">
                            <label>最大宽度 (像素):</label>
                            <input type="number" id="maxWidth" value="1920" min="100" max="5000">
                        </div>
                        <div class="input-group">
                            <label>最大高度 (像素):</label>
                            <input type="number" id="maxHeight" value="1080" min="100" max="5000">
                        </div>
                    </div>

                    <div class="tool-section">
                        <button class="btn" onclick="compressImage()">压缩图片</button>
                        <button class="btn" onclick="downloadCompressed()" id="downloadBtn" disabled>下载压缩图片</button>
                        <button class="btn" onclick="resetTool()">重置</button>
                    </div>
                </div>

                <div id="previewSection" style="display: none;">
                    <div class="preview-container">
                        <div class="preview-box">
                            <h4>原始图片</h4>
                            <img id="originalPreview" alt="原始图片">
                            <div class="file-info" id="originalInfo"></div>
                        </div>
                        <div class="preview-box">
                            <h4>压缩后图片</h4>
                            <img id="compressedPreview" alt="压缩后图片">
                            <div class="file-info" id="compressedInfo"></div>
                        </div>
                    </div>

                    <div class="compression-info" id="compressionInfo"></div>
                </div>

                <!-- 广告位 -->
                <div style="margin: 30px 0; text-align: center;">
                    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9340624494211701"
                        data-ad-slot="1234567898" data-ad-format="auto" data-full-width-responsive="true"></ins>
                    <script>
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </div>

            <div class="handler"></div>
        </div>
    </div>

    <script src="../js/reg.js"></script>
    <script>
        let originalFile = null;
        let originalImageData = null;
        let compressedImageData = null;

        function updateQualityValue(value) {
            document.getElementById('qualityValue').textContent = value;
        }

        function toggleResizeOptions() {
            const checkbox = document.getElementById('resizeCheckbox');
            const options = document.getElementById('resizeOptions');
            options.style.display = checkbox.checked ? 'block' : 'none';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }

            originalFile = file;
            const reader = new FileReader();
            reader.onload = function (e) {
                originalImageData = e.target.result;
                document.getElementById('originalPreview').src = originalImageData;
                document.getElementById('originalInfo').textContent = 
                    `文件名: ${file.name} | 大小: ${formatFileSize(file.size)}`;
                document.getElementById('optionsSection').style.display = 'block';
                document.getElementById('previewSection').style.display = 'none';
                document.getElementById('downloadBtn').disabled = true;
            };
            reader.readAsDataURL(file);
        }

        function compressImage() {
            if (!originalImageData) {
                alert('请先选择图片');
                return;
            }

            const quality = parseFloat(document.getElementById('qualityRange').value);
            const resizeEnabled = document.getElementById('resizeCheckbox').checked;
            const maxWidth = parseInt(document.getElementById('maxWidth').value) || 1920;
            const maxHeight = parseInt(document.getElementById('maxHeight').value) || 1080;

            // 显示加载状态
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('compressedPreview').src = '';
            document.getElementById('compressedInfo').textContent = '正在压缩...';
            document.getElementById('compressionInfo').innerHTML = '<p>正在处理图片...</p>';

            const img = new Image();
            img.onload = function () {
                try {
                    let width = img.width;
                    let height = img.height;

                    // 如果需要调整尺寸
                    if (resizeEnabled) {
                        const ratio = Math.min(maxWidth / width, maxHeight / height);
                        if (ratio < 1) {
                            width = Math.floor(width * ratio);
                            height = Math.floor(height * ratio);
                        }
                    }

                    // 创建 canvas 进行压缩
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    
                    // 设置更好的渲染质量
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    
                    ctx.drawImage(img, 0, 0, width, height);

                    // 确定输出格式：PNG 转换为 JPEG 以获得更好的压缩效果
                    const originalType = originalFile.type.toLowerCase();
                    let outputType = 'image/jpeg';
                    let outputQuality = quality;
                    
                    // 如果原图是 PNG 且需要透明度，保持 PNG 格式但质量参数无效
                    // 为了压缩，我们统一转换为 JPEG
                    if (originalType === 'image/png') {
                        // 检查是否有透明度
                        const imageData = ctx.getImageData(0, 0, width, height);
                        const hasAlpha = imageData.data.some((pixel, index) => index % 4 === 3 && pixel < 255);
                        
                        // 如果有透明度，先填充白色背景
                        if (hasAlpha) {
                            ctx.globalCompositeOperation = 'destination-over';
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillRect(0, 0, width, height);
                            ctx.globalCompositeOperation = 'source-over';
                        }
                    }

                    // 转换为 blob，使用 JPEG 格式和指定的质量
                    canvas.toBlob(function (blob) {
                        if (!blob) {
                            alert('压缩失败，请重试');
                            document.getElementById('compressedInfo').innerHTML = '<p style="color: red;">压缩失败</p>';
                            return;
                        }

                        const reader = new FileReader();
                        reader.onload = function (e) {
                            compressedImageData = e.target.result;
                            document.getElementById('compressedPreview').src = compressedImageData;
                            document.getElementById('compressedInfo').textContent = 
                                `大小: ${formatFileSize(blob.size)} | 格式: JPEG`;
                            
                            // 显示压缩信息
                            const originalSize = originalFile.size;
                            const compressedSize = blob.size;
                            const compressionRatio = compressedSize < originalSize 
                                ? ((1 - compressedSize / originalSize) * 100).toFixed(2)
                                : ((compressedSize / originalSize - 1) * 100).toFixed(2);
                            const isCompressed = compressedSize < originalSize;
                            
                            document.getElementById('compressionInfo').innerHTML = `
                                <p>原始大小: <span class="highlight">${formatFileSize(originalSize)}</span></p>
                                <p>压缩后大小: <span class="highlight">${formatFileSize(compressedSize)}</span></p>
                                <p>${isCompressed ? '压缩率' : '增加'}: <span class="highlight" style="color: ${isCompressed ? 'green' : 'red'};">${isCompressed ? '-' : '+'}${compressionRatio}%</span></p>
                                <p>尺寸: <span class="highlight">${width} × ${height} 像素</span></p>
                                <p>质量: <span class="highlight">${(quality * 100).toFixed(0)}%</span></p>
                            `;

                            document.getElementById('downloadBtn').disabled = false;
                        };
                        reader.onerror = function() {
                            alert('读取压缩图片失败');
                            document.getElementById('compressedInfo').innerHTML = '<p style="color: red;">处理失败</p>';
                        };
                        reader.readAsDataURL(blob);
                    }, outputType, outputQuality);
                } catch (error) {
                    console.error('压缩错误:', error);
                    alert('压缩失败: ' + error.message);
                    document.getElementById('compressedInfo').innerHTML = '<p style="color: red;">压缩失败: ' + error.message + '</p>';
                }
            };
            img.onerror = function() {
                alert('图片加载失败，请选择有效的图片文件');
                document.getElementById('compressedInfo').innerHTML = '<p style="color: red;">图片加载失败</p>';
            };
            img.src = originalImageData;
        }

        function downloadCompressed() {
            if (!compressedImageData) {
                alert('请先压缩图片');
                return;
            }

            const link = document.createElement('a');
            // 获取原始文件名（不含扩展名）
            const originalName = originalFile.name.replace(/\.[^/.]+$/, '');
            // 使用 JPEG 扩展名
            link.download = 'compressed_' + originalName + '.jpg';
            link.href = compressedImageData;
            link.click();
        }

        function resetTool() {
            document.getElementById('fileInput').value = '';
            document.getElementById('optionsSection').style.display = 'none';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('qualityRange').value = 0.8;
            updateQualityValue(0.8);
            document.getElementById('resizeCheckbox').checked = false;
            toggleResizeOptions();
            originalFile = null;
            originalImageData = null;
            compressedImageData = null;
        }
    </script>
</body>
