<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID生成器 | Buttonwood工具集</title>
    <link rel="shortcut icon" href="../img/logo.png">
    <style>
        :root{--bg:#0a0a14;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--cyan:#00e5ff;--text:#e0e0e0;--dim:rgba(255,255,255,0.5)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
        .container{max-width:700px;width:100%}
        .back{color:var(--dim);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;transition:color .3s}
        .back:hover{color:var(--cyan)}
        h1{font-size:28px;font-weight:800;margin-bottom:8px}
        .subtitle{color:var(--dim);font-size:14px;margin-bottom:32px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
        .uuid-display{font-family:'SF Mono',Consolas,monospace;font-size:18px;background:rgba(0,0,0,0.3);padding:16px;border-radius:10px;word-break:break-all;text-align:center;letter-spacing:1px;color:var(--cyan);margin:12px 0}
        .btn{padding:10px 24px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .3s;margin:4px}
        .btn-primary{background:var(--cyan);color:#000}
        .btn-primary:hover{box-shadow:0 4px 20px rgba(0,229,255,.3);transform:translateY(-1px)}
        .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
        .btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
        .uuid-list{list-style:none;margin-top:16px}
        .uuid-list li{font-family:monospace;font-size:13px;padding:10px 14px;background:rgba(0,0,0,0.2);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;color:var(--dim);word-break:break-all}
        .uuid-list li button{background:var(--border);border:none;color:var(--text);padding:4px 12px;border-radius:12px;cursor:pointer;font-size:11px;white-space:nowrap;margin-left:10px;transition:all .3s}
        .uuid-list li button:hover{background:var(--cyan);color:#000}
        input[type=number]{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;width:80px;font-size:14px;text-align:center}
        .copied{color:#69f0ae;font-size:12px;margin-left:8px;opacity:0;transition:opacity .3s}
        .copied.show{opacity:1}
    </style>
</head>
<body>
    <div class="container">
        <a href="../tools.html" class="back">← 返回工具列表</a>
        <h1>🎲 UUID生成器</h1>
        <p class="subtitle">一键生成UUID v4唯一标识符</p>

        <div class="card">
            <h3>生成单个UUID</h3>
            <div class="uuid-display" id="singleUuid">点击下方按钮生成</div>
            <button class="btn btn-primary" onclick="genSingle()">生成UUID</button>
            <button class="btn btn-ghost" onclick="copyUuid()">📋 复制 <span class="copied" id="copiedMsg">已复制!</span></button>
        </div>

        <div class="card">
            <h3>批量生成</h3>
            <label style="color:var(--dim);font-size:13px;">数量: <input type="number" id="batchCount" value="10" min="1" max="100"></label>
            <button class="btn btn-primary" onclick="genBatch()" style="margin-left:10px;">批量生成</button>
            <button class="btn btn-ghost" onclick="copyAll()">📋 复制全部</button>
            <ul class="uuid-list" id="uuidList"></ul>
        </div>
    </div>

    <script>
    function uuidv4(){
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
            const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);
            return v.toString(16);
        });
    }

    function genSingle(){
        document.getElementById('singleUuid').textContent=uuidv4();
    }

    function copyUuid(){
        const t=document.getElementById('singleUuid').textContent;
        if(t==='点击下方按钮生成')return;
        navigator.clipboard.writeText(t).then(()=>{
            const m=document.getElementById('copiedMsg');m.classList.add('show');
            setTimeout(()=>m.classList.remove('show'),1500);
        });
    }

    function genBatch(){
        const n=parseInt(document.getElementById('batchCount').value)||10;
        const list=document.getElementById('uuidList');list.innerHTML='';
        for(let i=0;i<n;i++){
            const li=document.createElement('li');
            const uuid=uuidv4();
            li.innerHTML=`${uuid}<button onclick="copyOne(this,'${uuid}')">复制</button>`;
            list.appendChild(li);
        }
    }

    function copyOne(btn,uuid){
        navigator.clipboard.writeText(uuid).then(()=>{
            btn.textContent='已复制!';btn.style.background='#69f0ae';btn.style.color='#000';
            setTimeout(()=>{btn.textContent='复制';btn.style.background='';btn.style.color='';},1200);
        });
    }

    function copyAll(){
        const items=document.querySelectorAll('#uuidList li');
        if(!items.length)return;
        const all=Array.from(items).map(li=>li.textContent.replace('复制','').trim()).join('\n');
        navigator.clipboard.writeText(all).then(()=>{
            const m=document.getElementById('copiedMsg');m.textContent='全部已复制!';m.classList.add('show');
            setTimeout(()=>{m.classList.remove('show');m.textContent='已复制!';},1500);
        });
    }
    </script>
</body>
</html>
