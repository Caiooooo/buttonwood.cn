<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻牌记忆 | Buttonwood</title>
    <link rel="shortcut icon" href="../img/logo.png">
    <style>
        :root{--bg:#0a0a14;--cyan:#00e5ff;--text:#e0e0e0;--dim:rgba(255,255,255,0.5);--pink:#ff4081}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px 20px}
        .back{color:var(--dim);text-decoration:none;font-size:13px;margin-bottom:20px;transition:color .3s;align-self:flex-start}
        .back:hover{color:var(--cyan)}
        h1{font-size:26px;margin-bottom:4px}
        .stats{display:flex;gap:24px;margin-bottom:16px;font-size:14px}
        .stats span{color:var(--cyan);font-weight:600}
        .board{display:grid;grid-template-columns:repeat(4,80px);grid-template-rows:repeat(4,80px);gap:8px}
        .card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;transition:all .2s;user-select:none}
        .card.flipped,.card.matched{background:rgba(255,255,255,0.12);border-color:var(--cyan)}
        .card.matched{opacity:0.5;cursor:default}
        .card:hover:not(.matched):not(.flipped){border-color:rgba(255,255,255,0.3)}
        .info{color:var(--dim);font-size:12px;margin-top:12px}
        .restart{margin-top:12px;padding:10px 28px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--cyan);color:#000;transition:all .3s}
        .restart:hover{box-shadow:0 4px 20px rgba(0,229,255,.3);transform:translateY(-1px)}
    </style>
</head>
<body>
    <a href="../tools.html" class="back">← 返回工具列表</a>
    <h1>🧠 翻牌记忆</h1>
    <div class="stats">
        步数: <span id="moves">0</span> | 配对: <span id="pairs">0</span>/8
    </div>
    <div class="board" id="board"></div>
    <p class="info">点击翻牌 · 找到所有配对</p>
    <button class="restart" onclick="restart()">重新开始</button>

    <script>
    const emojis=['🐶','🐱','🐼','🐨','🦊','🐰','🐸','🐵'];
    let cards=[],flipped=[],matched=[],moves=0,pairs=0,locked=false;

    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

    function restart(){
        cards=shuffle([...emojis,...emojis]);
        flipped=[];matched=[];moves=0;pairs=0;locked=false;
        document.getElementById('moves').textContent='0';
        document.getElementById('pairs').textContent='0';
        render();
    }

    function render(){
        const b=document.getElementById('board');b.innerHTML='';
        cards.forEach((emoji,i)=>{
            const d=document.createElement('div');d.className='card';
            if(flipped.includes(i)||matched.includes(i)){d.classList.add('flipped');d.textContent=emoji}
            if(matched.includes(i))d.classList.add('matched');
            d.addEventListener('click',()=>flip(i));
            b.appendChild(d);
        });
    }

    function flip(i){
        if(locked||flipped.includes(i)||matched.includes(i))return;
        flipped.push(i);moves++;
        document.getElementById('moves').textContent=moves;
        if(flipped.length===2){
            locked=true;
            if(cards[flipped[0]]===cards[flipped[1]]){
                matched.push(flipped[0],flipped[1]);pairs++;
                document.getElementById('pairs').textContent=pairs;
                flipped=[];locked=false;render();
                if(pairs===8)setTimeout(()=>alert('🎉 恭喜！你用了 '+moves+' 步完成！'),200);
            }else{
                render();
                setTimeout(()=>{flipped=[];locked=false;render()},700);
            }
        }else{render()}
    }

    restart();
    </script>
</body>
</html>
