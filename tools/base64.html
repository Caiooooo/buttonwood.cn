<body onload="loaduser()" id="home">
    <div class="container">
        <div class="left-box" id="left-box"></div>
        <script>
            function isMobileDevice() {
                return window.innerWidth / window.innerHeight < 1.2;
            }
            function setLeftBoxWidth() {
                const leftBox = document.getElementById('left-box');
                const handler = document.querySelector('.handler');
                const containerWidth = document.querySelector('.container').offsetWidth;
                const menuButton = document.getElementById('menu-button');
                if (isMobileDevice()) {
                    leftBox.style.width = '0';
                    if (handler) handler.style.left = "5px";
                    if (handler) handler.classList.add('close');
                    if (menuButton) menuButton.style.display = 'block';
                } else {
                    const sidebarWidth = Math.max(containerWidth * 0.02, 210);
                    leftBox.style.width = sidebarWidth + 'px';
                    if (handler) handler.style.left = (sidebarWidth + 5) + "px";
                    if (handler) handler.classList.remove('close');
                    if (menuButton) menuButton.style.display = 'none';
                }
            }
            fetch('../leftbox.html')
                .then(response => response.text())
                .then(data => {
                    // 修复路径：将 img/ 替换为 ../img/
                    data = data.replace(/src="img\//g, 'src="../img/');
                    document.getElementById('left-box').innerHTML = data;
                    // 确保图片路径正确（再次检查）
                    const userImage = document.querySelector(".user-info img");
                    if (userImage && !userImage.src.includes('../img/')) {
                        userImage.src = "../img/bw.jpg";
                    }
                    // 修复图标背景图片路径
                    setTimeout(() => {
                        const iconMap = {
                            'icon-home': '../img/icon/home.png',
                            'icon-design': '../img/icon/灯泡.png',
                            'icon-art': '../img/icon/笔.png',
                            'icon-photo': '../img/icon/相机.png',
                            'icon-create': '../img/icon/册子.png',
                            'icon-tools': '../img/icon/几何.png',
                            'aboutUs': '../img/icon/爱情.png'
                        };
                        Object.keys(iconMap).forEach(className => {
                            const icons = document.querySelectorAll(`.left-box .${className}`);
                            icons.forEach(icon => {
                                icon.style.backgroundImage = `url("${iconMap[className]}")`;
                            });
                        });
                    }, 100);
                    setLeftBoxWidth();
                    window.addEventListener('resize', setLeftBoxWidth);
                    const menuButton = document.getElementById('menu-button');
                    const leftBox = document.getElementById('left-box');
                    const handler = document.querySelector('.handler');
                    if (menuButton) {
                        menuButton.addEventListener('click', function () {
                            this.classList.toggle('active');
                            if (leftBox.style.width === '0px') {
                                leftBox.style.width = '210px';
                                if (handler) handler.style.left = "215px";
                                if (handler) handler.classList.remove('close');
                            } else {
                                leftBox.style.width = '0';
                                if (handler) handler.style.left = "5px";
                                if (handler) handler.classList.add('close');
                            }
                        });
                    }
                })
                .catch(error => console.error('Error loading left-box.html:', error));
        </script>

        <div class="right-box" style="background: none;">

                        <input type="file" id="fileInput" onchange="handleFileSelect(event)">

                    <textarea id="textInput" placeholder="请输入要编码的文本或粘贴Base64字符串进行解码..."></textarea>

                    <button class="btn" onclick="encodeBase64()">编码 (Encode)</button>

                    <button class="btn" onclick="copyText()">复制结果</button>

            <div class="handler"></div>

    <script src="../js/reg.js"></script>
    <script>
        function encodeBase64() {
            const input = document.getElementById('textInput').value;
            if (!input) {
                alert('请输入要编码的文本');
                return;
            }
            try {
                const encoded = btoa(unescape(encodeURIComponent(input)));
                document.getElementById('textInput').value = encoded;
            } catch (e) {
                alert('编码失败: ' + e.message);
            }
        }

        function decodeBase64() {
            const input = document.getElementById('textInput').value.trim();
            if (!input) {
                alert('请输入要解码的Base64字符串');
                return;
            }
            try {
                const decoded = decodeURIComponent(escape(atob(input)));
                document.getElementById('textInput').value = decoded;
            } catch (e) {
                alert('解码失败，请检查Base64格式是否正确: ' + e.message);
            }
        }

        function clearText() {
            document.getElementById('textInput').value = '';
            document.getElementById('fileInput').value = '';
        }

        function copyText() {
            const text = document.getElementById('textInput').value;
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制到剪贴板');
            }).catch(err => {
                alert('复制失败: ' + err);
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const arrayBuffer = e.target.result;
                const bytes = new Uint8Array(arrayBuffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64 = btoa(binary);
                document.getElementById('textInput').value = base64;
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
