<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 | Buttonwood</title>
    <link rel="shortcut icon" href="../img/logo.png">
    <style>
        :root{--bg:#0a0a14;--cyan:#00e5ff;--text:#e0e0e0;--dim:rgba(255,255,255,0.5)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px 20px}
        .back{color:var(--dim);text-decoration:none;font-size:13px;margin-bottom:20px;transition:color .3s;align-self:flex-start}
        .back:hover{color:var(--cyan)}
        h1{font-size:26px;margin-bottom:4px}
        .score{font-size:16px;color:var(--cyan);margin-bottom:12px}
        .grid{display:grid;grid-template-columns:repeat(4,80px);grid-template-rows:repeat(4,80px);gap:8px;background:rgba(255,255,255,0.04);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08)}
        .cell{background:rgba(255,255,255,0.06);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;transition:all .15s}
        .c2{background:rgba(255,255,255,0.08)}.c4{background:rgba(255,200,100,0.3)}.c8{background:rgba(255,150,50,0.4)}.c16{background:rgba(255,100,50,0.5)}.c32{background:rgba(255,70,40,0.6)}.c64{background:rgba(255,40,30,0.7)}.c128{background:rgba(255,200,50,0.6);font-size:20px}.c256{background:rgba(255,200,30,0.7);font-size:20px}.c512{background:rgba(255,180,20,0.8);font-size:20px}.c1024{background:rgba(255,150,10,0.85);font-size:18px}.c2048{background:rgba(0,229,255,0.8);font-size:18px}
        .info{color:var(--dim);font-size:12px;margin-top:12px}
        .restart{margin-top:12px;padding:10px 28px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--cyan);color:#000;transition:all .3s}
        .restart:hover{box-shadow:0 4px 20px rgba(0,229,255,.3);transform:translateY(-1px)}
    </style>
</head>
<body>
    <a href="../tools.html" class="back">← 返回工具列表</a>
    <h1>🔢 2048</h1>
    <div class="score">得分: <span id="score">0</span></div>
    <div class="grid" id="grid"></div>
    <p class="info">方向键 ↑↓←→ 移动 · 相同数字合并</p>
    <button class="restart" onclick="restart()">重新开始</button>

    <script>
    let board=[],score=0;
    function restart(){
        board=Array.from({length:4},()=>Array(4).fill(0));
        score=0;document.getElementById('score').textContent='0';
        addRandom();addRandom();render();
    }
    function addRandom(){
        const empty=[];board.forEach((r,i)=>r.forEach((c,j)=>{if(!c)empty.push([i,j])}));
        if(empty.length){const[i,j]=empty[Math.floor(Math.random()*empty.length)];board[i][j]=Math.random()<0.9?2:4}
    }
    function render(){
        const g=document.getElementById('grid');g.innerHTML='';
        board.forEach(r=>r.forEach(v=>{
            const d=document.createElement('div');d.className='cell'+(v?' c'+v:'');
            d.textContent=v||'';g.appendChild(d);
        }));
    }
    function slide(row){
        let arr=row.filter(v=>v);
        for(let i=0;i<arr.length-1;i++){if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr[i+1]=0}}
        arr=arr.filter(v=>v);
        while(arr.length<4)arr.push(0);
        document.getElementById('score').textContent=score;
        return arr;
    }
    function move(dir){
        let moved=false,old=board.map(r=>[...r]);
        if(dir==='left')board=board.map(slide);
        else if(dir==='right')board=board.map(r=>slide([...r].reverse()).reverse());
        else if(dir==='up'){for(let j=0;j<4;j++){let col=slide(board.map(r=>r[j]));col.forEach((v,i)=>board[i][j]=v)}}
        else if(dir==='down'){for(let j=0;j<4;j++){let col=slide(board.map(r=>r[3-j]).reverse()).reverse();col.forEach((v,i)=>board[3-i][j]=v)}}
        moved=board.some((r,i)=>r.some((v,j)=>v!==old[i][j]));
        if(moved){addRandom();render();if(isGameOver())setTimeout(()=>alert('游戏结束！得分: '+score),100)}
    }
    function isGameOver(){
        for(let i=0;i<4;i++)for(let j=0;j<4;j++){
            if(!board[i][j])return false;
            if(i<3&&board[i][j]===board[i+1][j])return false;
            if(j<3&&board[i][j]===board[i][j+1])return false;
        }
        return true;
    }
    document.addEventListener('keydown',e=>{
        const k=e.key;
        if(k==='ArrowUp'){move('up');e.preventDefault()}
        if(k==='ArrowDown'){move('down');e.preventDefault()}
        if(k==='ArrowLeft'){move('left');e.preventDefault()}
        if(k==='ArrowRight'){move('right');e.preventDefault()}
    });
    restart();
    </script>
</body>
</html>
